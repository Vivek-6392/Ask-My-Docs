name: CI — Test & Evaluate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ hashFiles('requirements.txt') }}

      - name: Install lint deps
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check . --select E,W,F --ignore E501

      - name: Ruff format check
        run: ruff format --check .

  # ── Job 2: Unit Tests ────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v \
            --cov=retrieval \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not integration"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Job 3: RAG Evaluation (main branch only) ─────────────────────────────────
  rag-evaluation:
    name: RAG Quality Gate
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main'
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed test documents
        run: python scripts/seed_eval_docs.py

      - name: Run RAGAS evaluation
        run: python -m evaluation.evaluator --dataset evaluation/eval_dataset.json --output evaluation/results.json

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: ragas-results
          path: evaluation/results.json

      - name: Comment results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('evaluation/results.json'));
            const scores = results.scores;
            const passed = results.passed;
            const emoji = passed ? '✅' : '❌';
            const body = `## ${emoji} RAG Evaluation Results\n\n` +
              `| Metric | Score | Threshold |\n` +
              `|--------|-------|----------|\n` +
              `| Faithfulness | ${scores.faithfulness?.toFixed(3)} | 0.80 |\n` +
              `| Answer Relevancy | ${scores.answer_relevancy?.toFixed(3)} | 0.75 |\n` +
              `| Context Precision | ${scores.context_precision?.toFixed(3)} | 0.70 |\n` +
              `| Context Recall | ${scores.context_recall?.toFixed(3)} | 0.70 |\n\n` +
              `**Overall: ${passed ? 'PASSED' : 'FAILED'}**`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # ── Job 4: Docker Build Check ────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ask-my-docs:ci .

      - name: Smoke test container
        run: |
          docker run --rm \
            -e OPENAI_API_KEY=sk-test \
            ask-my-docs:ci \
            python -c "from app.config import AppConfig; print('Config OK')"
